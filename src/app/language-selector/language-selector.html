<div class="language-selector" [class.open]="isOpen">
  <button class="current-language" (click)="toggleDropdown()" aria-label="Select language">
    <img [src]="getCurrentFlag()" [alt]="currentLanguage" class="flag-icon">
    <svg class="dropdown-arrow" [class.rotated]="isOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6,9 12,15 18,9"></polyline>
    </svg>
  </button>
  
  <div class="dropdown-menu" [class.visible]="isOpen">
    <button 
      *ngFor="let lang of languages" 
      class="language-option"
      [class.active]="lang.code === currentLanguage"
      (click)="selectLanguage(lang.code)"
      [attr.aria-label]="'Select ' + lang.name">
      <img [src]="lang.flag" [alt]="lang.name" class="flag-icon">
      <span class="language-name">{{ lang.name }}</span>
      <svg *ngIf="lang.code === currentLanguage" class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20,6 9,17 4,12"></polyline>
      </svg>
    </button>
  </div>
</div>
